[package]
name = "gpui-metro"
description = "Windows Phone Metro design language for GPUI: live tiles, pivot, panorama, app bar and friends."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
anyhow.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "test-support"] }
