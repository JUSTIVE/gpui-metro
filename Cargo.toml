[workspace]
resolver = "2"
members = ["crates/gpui-metro", "apps/catalog", "apps/no-ativ"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-metro = { path = "crates/gpui-metro" }
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
