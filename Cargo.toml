[workspace]
resolver = "2"
members = ["crates/gpui-metro", "apps/catalog", "apps/no-ativ"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Zed's gpui, pinned. gpui_platform supplies the platform backend and the
# application entry point; runtime_shaders avoids needing Xcode's Metal Toolchain.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a7d74150ac7a663fdaa01ec5177e303baaf6c331" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a7d74150ac7a663fdaa01ec5177e303baaf6c331", features = ["font-kit", "runtime_shaders"] }
gpui-metro = { path = "crates/gpui-metro" }
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
